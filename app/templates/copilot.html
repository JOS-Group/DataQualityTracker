<div class="hero"><h1>AI Copilot</h1><p>A conversational analyst that understands your persona, filters, mappings, and current findings.</p></div>
<div class="chat-window">
  {% for m in chat %}
  <div class="chat-msg chat-{{ m.role }}">
    <div class="chat-role">{{ "You" if m.role == "user" else "Copilot" }}</div>
    <div class="chat-bubble">{{ m.content|markdown }}</div>
  </div>
  {% endfor %}
</div>
